<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>База штрихкодов с анимацией</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 24px 20px 32px;
            position: relative;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #718096;
            letter-spacing: 0;
        }
        .badge-db {
            background: #2b6cb0;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: auto;
            transition: transform 0.2s;
        }
        .badge-db.pop {
            animation: popBadge 0.3s ease;
        }
        @keyframes popBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); background: #48bb78; }
            100% { transform: scale(1); }
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            gap: 6px;
            background: #edf2f7;
            border-radius: 16px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: white;
            color: #2b6cb0;
            box-shadow: 0 2px 8px rgba(43, 108, 176, 0.15);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.5);
        }
        .tab-btn .icon {
            font-size: 16px;
        }

        /* ---------- Camera ---------- */
        .camera-wrapper {
            background: #1a202c;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .camera-wrapper .placeholder {
            color: #a0aec0;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }
        .camera-wrapper .placeholder .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        .scan-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: inset 0 0 0 2px rgba(43, 108, 176, 0.3);
        }
        .scan-overlay .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #63b3ed;
            border-style: solid;
            border-width: 0;
        }
        .scan-overlay .corner.tl {
            top: 16px;
            left: 16px;
            border-top-width: 4px;
            border-left-width: 4px;
            border-radius: 4px 0 0 0;
        }
        .scan-overlay .corner.tr {
            top: 16px;
            right: 16px;
            border-top-width: 4px;
            border-right-width: 4px;
            border-radius: 0 4px 0 0;
        }
        .scan-overlay .corner.bl {
            bottom: 16px;
            left: 16px;
            border-bottom-width: 4px;
            border-left-width: 4px;
            border-radius: 0 0 0 4px;
        }
        .scan-overlay .corner.br {
            bottom: 16px;
            right: 16px;
            border-bottom-width: 4px;
            border-right-width: 4px;
            border-radius: 0 0 4px 0;
        }

        /* Flash overlay */
        #flashOverlay {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            border-radius: 18px;
            transition: opacity 0.05s;
            z-index: 10;
        }
        #flashOverlay.flash {
            opacity: 0.8;
            transition: opacity 0s;
        }
        #flashOverlay.flash-end {
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }

        /* ---------- Controls ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }
        .controls .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #edf2f7;
            color: #2d3748;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .controls .btn-primary {
            background: #2b6cb0;
            color: white;
        }
        .controls .btn-primary:hover {
            background: #1a4f8b;
        }
        .controls .btn-success {
            background: #38a169;
            color: white;
        }
        .controls .btn-success:hover {
            background: #2f855a;
        }
        .controls .btn-danger {
            background: #e53e3e;
            color: white;
        }
        .controls .btn-danger:hover {
            background: #c53030;
        }
        .controls .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .controls .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
        }
        .controls .btn-outline:hover {
            background: #f7fafc;
        }

        /* ---------- Manual input ---------- */
        .manual-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .manual-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .manual-row input:focus {
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
        }
        .manual-row .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            background: #2b6cb0;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .manual-row .btn:hover {
            background: #1a4f8b;
        }

        /* ---------- Status ---------- */
        .status {
            padding: 14px 16px;
            border-radius: 14px;
            background: #f7fafc;
            border-left: 5px solid #a0aec0;
            margin-bottom: 16px;
            font-size: 14px;
            min-height: 56px;
            display: flex;
            align-items: center;
            word-break: break-word;
            transition: background 0.3s, border-color 0.3s, transform 0.15s;
            position: relative;
        }
        .status.info {
            border-left-color: #2b6cb0;
            background: #ebf4ff;
        }
        .status.success {
            border-left-color: #38a169;
            background: #f0fff4;
        }
        .status.warning {
            border-left-color: #d69e2e;
            background: #fffbeb;
        }
        .status.error {
            border-left-color: #e53e3e;
            background: #fff5f5;
        }
        .status .label {
            font-weight: 600;
            margin-right: 6px;
        }
        .status .highlight {
            font-weight: 700;
            color: #2b6cb0;
            background: #dbeafe;
            padding: 0 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .status.pop {
            animation: statusPop 0.3s ease;
        }
        @keyframes statusPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* ---------- Database list ---------- */
        .db-section {
            margin-top: 8px;
        }
        .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .db-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
        }
        .db-header .count {
            background: #edf2f7;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 13px;
            color: #4a5568;
            transition: 0.2s;
        }
        .db-list {
            max-height: 260px;
            overflow-y: auto;
            border-radius: 14px;
            border: 1px solid #edf2f7;
        }
        .db-list .empty {
            padding: 30px 20px;
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
        }
        .db-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #edf2f7;
            gap: 12px;
            transition: 0.15s;
            opacity: 1;
            transform: translateY(0);
        }
        .db-item:last-child {
            border-bottom: none;
        }
        .db-item:hover {
            background: #f7fafc;
        }
        .db-item .code {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 14px;
            color: #2b6cb0;
            min-width: 80px;
            flex-shrink: 0;
        }
        .db-item .desc {
            flex: 1;
            font-size: 14px;
            color: #2d3748;
            word-break: break-word;
        }
        .db-item .desc.empty-desc {
            color: #a0aec0;
            font-style: italic;
        }
        .db-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .db-item .actions button {
            background: transparent;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.15s;
            color: #718096;
        }
        .db-item .actions button:hover {
            background: #edf2f7;
        }
        .db-item .actions .edit:hover {
            color: #2b6cb0;
        }
        .db-item .actions .del:hover {
            color: #e53e3e;
            background: #fff5f5;
        }

        /* анимация для нового элемента */
        .db-item.new-item {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(-12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 28px 24px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.92) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .modal .sub {
            color: #718096;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .modal .sub .code-display {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #2b6cb0;
        }
        .modal textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 70px;
            outline: none;
            transition: 0.2s;
        }
        .modal textarea:focus {
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.12);
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .modal-actions .cancel {
            background: #edf2f7;
            color: #4a5568;
        }
        .modal .modal-actions .cancel:hover {
            background: #e2e8f0;
        }
        .modal .modal-actions .save {
            background: #2b6cb0;
            color: white;
        }
        .modal .modal-actions .save:hover {
            background: #1a4f8b;
        }

        /* ---------- Scrollbar ---------- */
        .db-list::-webkit-scrollbar {
            width: 5px;
        }
        .db-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .db-list::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 500px) {
            .app {
                padding: 16px 14px 24px;
                border-radius: 20px;
            }
            .tab-btn {
                font-size: 11px;
                padding: 8px 4px;
            }
            .tab-btn .icon {
                font-size: 14px;
            }
            .controls .btn {
                font-size: 12px;
                padding: 8px 12px;
            }
            .manual-row input {
                font-size: 14px;
                padding: 8px 12px;
            }
            .db-item {
                flex-wrap: wrap;
                gap: 6px;
            }
            .db-item .code {
                min-width: 60px;
                font-size: 13px;
            }
            .status {
                font-size: 13px;
                padding: 12px 14px;
                min-height: 48px;
            }
            .modal {
                padding: 20px 16px;
            }
        }

        /* ---------- Camera loading ---------- */
        .camera-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a202c;
            color: #a0aec0;
            font-size: 14px;
            flex-direction: column;
            gap: 12px;
            border-radius: 18px;
            z-index: 5;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #2d3748;
            border-top-color: #63b3ed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .camera-wrapper .placeholder .sub-text {
            font-size: 13px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Header -->
        <h1>
            📦 База ШК
            <span class="badge-db" id="dbBadge">0</span>
        </h1>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-mode="add" id="tabAdd">
                <span class="icon">➕</span> Добавить
            </button>
            <button class="tab-btn" data-mode="info" id="tabInfo">
                <span class="icon">✏️</span> Описание
            </button>
            <button class="tab-btn" data-mode="lookup" id="tabLookup">
                <span class="icon">🔍</span> Найти
            </button>
        </div>

        <!-- Camera -->
        <div class="camera-wrapper" id="cameraWrapper">
            <video id="video" autoplay playsinline muted></video>
            <div id="flashOverlay"></div>
            <div class="scan-overlay" id="scanOverlay">
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>
            </div>
            <div class="camera-loading" id="cameraLoading">
                <div class="spinner"></div>
                <span>Запуск камеры...</span>
            </div>
            <div class="placeholder" id="placeholder" style="display:none;">
                <span class="big-icon">📷</span>
                Нажмите «Старт» для сканирования
                <div class="sub-text">или введите ШК вручную</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶ Старт</button>
            <button class="btn btn-outline" id="btnStop" disabled>⏹ Стоп</button>
            <span style="flex:1; min-width:40px;"></span>
            <button class="btn btn-danger" id="btnClearAll" title="Удалить все записи">🗑 Очистить</button>
        </div>

        <!-- Manual input -->
        <div class="manual-row">
            <input type="text" id="manualInput" placeholder="Введите ШК вручную..." />
            <button id="btnManual">➜</button>
        </div>

        <!-- Status -->
        <div class="status" id="status">
            <span>📌 Готов к сканированию</span>
        </div>

        <!-- Database list -->
        <div class="db-section">
            <div class="db-header">
                <h2>📋 Все записи</h2>
                <span class="count" id="countLabel">0</span>
            </div>
            <div class="db-list" id="dbList">
                <div class="empty">Нет записей. Добавьте первый штрихкод!</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">✏️ Редактировать описание</h3>
            <div class="sub" id="modalSub">ШК: <span class="code-display" id="modalCode">—</span></div>
            <textarea id="modalTextarea" placeholder="Введите описание товара…"></textarea>
            <div class="modal-actions">
                <button class="cancel" id="modalCancel">Отмена</button>
                <button class="save" id="modalSave">💾 Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const DB_KEY = 'barcodeDB';
        let db = {};
        let mode = 'add';
        let cameraActive = false;
        let scanInterval = null;
        let lastScanned = null;
        let modalResolve = null;
        let lastAddedCode = null; // для анимации нового элемента

        // DOM refs
        const video = document.getElementById('video');
        const cameraLoading = document.getElementById('cameraLoading');
        const placeholder = document.getElementById('placeholder');
        const statusEl = document.getElementById('status');
        const dbList = document.getElementById('dbList');
        const countLabel = document.getElementById('countLabel');
        const dbBadge = document.getElementById('dbBadge');
        const manualInput = document.getElementById('manualInput');
        const flashOverlay = document.getElementById('flashOverlay');

        const tabAdd = document.getElementById('tabAdd');
        const tabInfo = document.getElementById('tabInfo');
        const tabLookup = document.getElementById('tabLookup');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnClearAll = document.getElementById('btnClearAll');
        const btnManual = document.getElementById('btnManual');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSub = document.getElementById('modalSub');
        const modalCode = document.getElementById('modalCode');
        const modalTextarea = document.getElementById('modalTextarea');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');

        // ============================================================
        //  AUDIO (Web Audio beep)
        // ============================================================
        let audioCtx = null;

        function playBeep(type = 'success') {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = type === 'success' ? 880 : 440;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* игнорируем ошибки аудио */ }
        }

        // ============================================================
        //  DB HELPERS
        // ============================================================
        function loadDB() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                db = raw ? JSON.parse(raw) : {};
            } catch {
                db = {};
            }
            renderList();
        }

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderList();
        }

        function getBarcodeInfo(code) {
            return db[code] || null;
        }

        function setBarcodeInfo(code, desc) {
            db[code] = desc || '';
            saveDB();
        }

        function deleteBarcode(code) {
            delete db[code];
            saveDB();
        }

        function barcodeExists(code) {
            return code in db;
        }

        function countEntries() {
            return Object.keys(db).length;
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderList() {
            const keys = Object.keys(db);
            const count = keys.length;
            countLabel.textContent = count;
            dbBadge.textContent = count;

            if (count === 0) {
                dbList.innerHTML = `<div class="empty">📭 Нет записей. Добавьте первый штрихкод!</div>`;
                return;
            }

            let html = '';
            keys.sort((a, b) => a.localeCompare(b));
            for (const code of keys) {
                const desc = db[code] || '';
                const descDisplay = desc || '<span class="empty-desc">(нет описания)</span>';
                const isNew = (code === lastAddedCode);
                html += `
                    <div class="db-item ${isNew ? 'new-item' : ''}" data-code="${escapeHtml(code)}">
                        <span class="code">${escapeHtml(code)}</span>
                        <span class="desc">${descDisplay}</span>
                        <div class="actions">
                            <button class="edit" data-code="${escapeHtml(code)}" title="Редактировать">✏️</button>
                            <button class="del" data-code="${escapeHtml(code)}" title="Удалить">🗑</button>
                        </div>
                    </div>
                `;
            }
            dbList.innerHTML = html;

            // Если был добавлен новый элемент, через секунду убираем класс, чтобы анимация не повторялась
            if (lastAddedCode) {
                setTimeout(() => {
                    const items = dbList.querySelectorAll('.db-item.new-item');
                    items.forEach(el => el.classList.remove('new-item'));
                }, 400);
                // Сбрасываем, чтобы при следующем рендере не было ложного срабатывания
                // но оставляем до следующего добавления
            }

            // event listeners
            dbList.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = btn.dataset.code;
                    openEditModal(code);
                });
            });
            dbList.querySelectorAll('.del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = btn.dataset.code;
                    if (confirm(`Удалить штрихкод «${code}»?`)) {
                        deleteBarcode(code);
                        setStatus(`🗑 Удалён: ${code}`, 'warning');
                        playBeep('error');
                    }
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  STATUS
        // ============================================================
        function setStatus(msg, type = 'info', highlight = null) {
            let html = msg;
            if (highlight) {
                html = msg.replace(highlight, `<span class="highlight">${highlight}</span>`);
            }
            statusEl.innerHTML = html;
            statusEl.className = 'status ' + type;
            // анимация статуса
            statusEl.classList.remove('pop');
            // форсируем reflow
            void statusEl.offsetWidth;
            statusEl.classList.add('pop');
        }

        // ============================================================
        //  FLASH
        // ============================================================
        function triggerFlash(type = 'success') {
            flashOverlay.classList.remove('flash', 'flash-end');
            // форсируем reflow
            void flashOverlay.offsetWidth;
            flashOverlay.classList.add('flash');
            // через 100ms начинаем исчезновение
            setTimeout(() => {
                flashOverlay.classList.remove('flash');
                flashOverlay.classList.add('flash-end');
                setTimeout(() => {
                    flashOverlay.classList.remove('flash-end');
                }, 400);
            }, 100);
            // звук
            playBeep(type === 'success' ? 'success' : 'error');
        }

        // ============================================================
        //  CAMERA / BARCODE DETECTION
        // ============================================================
        async function startCamera() {
            if (cameraActive) return;
            try {
                cameraLoading.style.display = 'flex';
                placeholder.style.display = 'none';
                video.style.display = 'none';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                await video.play();

                if (!('BarcodeDetector' in window)) {
                    setStatus('⚠️ Ваш браузер не поддерживает сканирование камерой. Используйте ручной ввод.', 'error');
                    cameraLoading.style.display = 'none';
                    placeholder.style.display = 'flex';
                    video.style.display = 'none';
                    return;
                }

                cameraLoading.style.display = 'none';
                video.style.display = 'block';
                cameraActive = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                setStatus('📷 Камера запущена. Наведите на штрихкод...', 'info');

                const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e',
                        'itf', 'codabar'
                    ] });

                if (scanInterval) clearInterval(scanInterval);
                scanInterval = setInterval(async () => {
                    if (!cameraActive || video.readyState < 2) return;
                    try {
                        const barcodes = await detector.detect(video);
                        if (barcodes.length > 0) {
                            const code = barcodes[0].rawValue;
                            if (code !== lastScanned) {
                                lastScanned = code;
                                handleBarcode(code);
                            }
                        }
                    } catch (err) { /* игнор */ }
                }, 350);

                // Сброс lastScanned через время
                let resetTimer = null;
                const origHandle = handleBarcode;
                handleBarcode = function(code) {
                    if (resetTimer) clearTimeout(resetTimer);
                    origHandle(code);
                    resetTimer = setTimeout(() => {
                        lastScanned = null;
                    }, 2000);
                };

            } catch (err) {
                console.error('Camera error:', err);
                cameraLoading.style.display = 'none';
                placeholder.style.display = 'flex';
                video.style.display = 'none';
                setStatus('❌ Не удалось открыть камеру: ' + err.message, 'error');
                btnStart.disabled = false;
                btnStop.disabled = true;
            }
        }

        function stopCamera() {
            cameraActive = false;
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            video.style.display = 'none';
            placeholder.style.display = 'flex';
            cameraLoading.style.display = 'none';
            btnStart.disabled = false;
            btnStop.disabled = true;
            lastScanned = null;
            setStatus('⏹ Камера остановлена', 'info');
        }

        // ============================================================
        //  HANDLE BARCODE
        // ============================================================
        function handleBarcode(code) {
            if (!code || code.length < 3) return;

            const exists = barcodeExists(code);
            const info = getBarcodeInfo(code);

            switch (mode) {
                case 'add':
                    if (exists) {
                        setStatus(`⚠️ ШК <span class="highlight">${code}</span> уже есть в базе`, 'warning', code);
                        triggerFlash('error');
                    } else {
                        setBarcodeInfo(code, '');
                        lastAddedCode = code; // для анимации
                        setStatus(`✅ ШК <span class="highlight">${code}</span> добавлен!`, 'success', code);
                        triggerFlash('success');
                        // обновить бейдж с анимацией
                        dbBadge.classList.remove('pop');
                        void dbBadge.offsetWidth;
                        dbBadge.classList.add('pop');
                    }
                    break;

                case 'info':
                    if (exists) {
                        openEditModal(code, () => {
                            setStatus(`✏️ Описание для <span class="highlight">${code}</span> обновлено`, 'success',
                            code);
                            triggerFlash('success');
                        });
                        // Здесь мы не триггерим flash сразу, так как откроется модалка
                        // но при сохранении будет flash
                    } else {
                        setStatus(`❌ ШК <span class="highlight">${code}</span> не найден в базе`, 'error', code);
                        triggerFlash('error');
                    }
                    break;

                case 'lookup':
                    if (exists) {
                        const desc = info || '(нет описания)';
                        setStatus(`🔍 <span class="highlight">${code}</span> → ${desc}`, 'success', code);
                        triggerFlash('success');
                    } else {
                        setStatus(`❌ ШК <span class="highlight">${code}</span> не найден`, 'error', code);
                        triggerFlash('error');
                    }
                    break;

                default:
                    break;
            }
        }

        // ============================================================
        //  MODAL
        // ============================================================
        function openEditModal(code, onSaveCallback) {
            const info = getBarcodeInfo(code) || '';
            modalCode.textContent = code;
            modalTextarea.value = info;
            modalTitle.textContent = '✏️ Редактировать описание';
            modalSub.innerHTML = `ШК: <span class="code-display">${code}</span>`;
            modalOverlay.classList.add('open');
            modalTextarea.focus();
            modalTextarea.select();

            const saveHandler = () => {
                const newDesc = modalTextarea.value.trim();
                setBarcodeInfo(code, newDesc);
                modalOverlay.classList.remove('open');
                if (onSaveCallback) onSaveCallback();
                renderList();
                // обновим статус (уже в колбэке)
                // добавим flash
                triggerFlash('success');
            };

            modalSave.onclick = saveHandler;
            modalCancel.onclick = () => {
                modalOverlay.classList.remove('open');
            };

            modalTextarea.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveHandler();
                }
            };
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('open');
            }
        });

        // ============================================================
        //  MANUAL INPUT
        // ============================================================
        function handleManualInput() {
            const code = manualInput.value.trim();
            if (!code) {
                setStatus('⚠️ Введите штрихкод', 'warning');
                return;
            }
            manualInput.value = '';
            lastScanned = code;
            handleBarcode(code);
            setTimeout(() => { lastScanned = null; }, 2000);
        }

        // ============================================================
        //  TAB SWITCHING
        // ============================================================
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.mode === newMode);
            });
            const labels = {
                add: '➕ Добавление',
                info: '✏️ Добавление описания',
                lookup: '🔍 Поиск'
            };
            setStatus(`📌 Режим: ${labels[newMode]}. Наведите камеру на ШК.`, 'info');
            lastScanned = null;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            loadDB();

            setMode('add');

            tabAdd.addEventListener('click', () => setMode('add'));
            tabInfo.addEventListener('click', () => setMode('info'));
            tabLookup.addEventListener('click', () => setMode('lookup'));

            btnStart.addEventListener('click', startCamera);
            btnStop.addEventListener('click', stopCamera);

            btnManual.addEventListener('click', handleManualInput);
            manualInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleManualInput();
            });

            btnClearAll.addEventListener('click', () => {
                if (countEntries() === 0) {
                    setStatus('📭 База уже пуста', 'info');
                    return;
                }
                if (confirm('🗑 Удалить ВСЕ записи из базы?')) {
                    db = {};
                    saveDB();
                    setStatus('🗑 База очищена', 'warning');
                    playBeep('error');
                }
            });

            placeholder.style.display = 'flex';
            cameraLoading.style.display = 'none';

            // Автозапуск камеры
            startCamera();

            // Обновление счетчика
            setInterval(() => {
                const c = countEntries();
                if (parseInt(countLabel.textContent) !== c) {
                    renderList();
                }
            }, 3000);
        }

        // Переопределяем handleBarcode для возможности замены
        let handleBarcodeFn = handleBarcode;

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
